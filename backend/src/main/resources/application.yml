server:
  port: 8080

spring:
  application:
    name: 2024011443
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/2024011443?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义配置
campus:
  jwt:
    secret: "campus-market-secret-key-please-change-this-2026"
    expire-days: 7
  upload:
    # 文件上传目录（相对运行目录），需与 WebConfig 静态映射一致
    path: ./uploads/
    # 对外访问前缀
    url-prefix: /uploads
